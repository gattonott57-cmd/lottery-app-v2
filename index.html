<!DOCTYPE html>
<html>
<head>
  <title>抽選アプリ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-image: url("IMG_2642.jpeg");
      background-size: cover;
      background-position: center;
      text-align: center;
      color: white;
    }

    .container {
      background: rgba(0,0,0,0.6);
      padding: 30px;
      margin: 100px auto;
      width: 80%;
      max-width: 400px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      width: 80%;
      margin-bottom: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #ffcc00;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎯 抽選チャレンジ</h2>

    <input id="instagramId" placeholder="Instagram IDを入力">
    <br>
    <button id="drawBtn" disabled>抽選する</button>

    <p id="result"></p>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
